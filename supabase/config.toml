project_id = "lakecity-stand-sales"

# Customers are anonymous: these functions do their own auth (per-lead access token,
# DocuSign HMAC, or AuthoriseInfo for iveri-return), so the gateway JWT check is disabled.
[functions.lead-intake]
verify_jwt = false

[functions.lead-api]
verify_jwt = false

[functions.docusign-connect]
verify_jwt = false

[functions.iveri-return]
verify_jwt = false
